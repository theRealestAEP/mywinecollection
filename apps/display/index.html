<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Wine Journal</title>
    <link rel="icon" href="/icon-192.png" />
    <!-- The app on a phone's home screen: the manifest, and the tags that an iPhone reads instead. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Wine Journal" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#fbfaf6" />
    <script>
      // On an e-ink screen, the link ends with &eink: the page fills the screen
      // with paper and turns instantly (see style.css). This runs before the
      // first paint, so the screen never shows the dark desk.
      if (new URLSearchParams(location.search).has('eink')) document.documentElement.classList.add('eink');
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Annie+Use+Your+Telescope&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap"
    />
  </head>
  <body>
    <main id="page" class="page"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
